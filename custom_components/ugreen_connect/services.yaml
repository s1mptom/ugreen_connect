set_wallpaper:
  # No `target:` -- a service target cannot filter devices by integration, and
  # the charger is already picked with the device selector below.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ugreen_connect
    path:
      required: false
      example: /config/www/desk.jpg
      selector:
        text:
    url:
      required: false
      example: https://example.com/desk.jpg
      selector:
        text:
    image:
      required: false
      example: "data:image/jpeg;base64,/9j/4AAQ..."
      selector:
        text:
