# The charger with a dashboard to itself, laid out by the card rather than by
# Home Assistant's column grid.
#
# `ugreen-dashboard-card` draws the same pieces as docs/dashboard.yaml -- they
# are the same cards -- but decides their sizes itself: the ports table is as
# tall as it needs to be, the chart sits beside it, and the strip runs across
# the top. That only works in a view given over to one card, which is what
# `type: panel` means. Below about 1100px it folds to a single column.
#
# TO USE: paste under `views:` in a dashboard's raw configuration editor and
# replace the device_id with your charger's (Settings -> Devices -> your
# charger; it is the last part of the URL). With one charger set up, the
# device_id can be dropped entirely -- the card finds it.
#
# Take docs/dashboard.yaml instead if this dashboard holds anything besides the
# charger: a panel view has room for one card and nothing else.

title: Charger
path: charger
icon: mdi:ev-station
type: panel
cards:
- type: custom:ugreen-dashboard-card
  device_id: 0123456789abcdef0123456789abcdef
  # Drop this or set it to your model's rating; without it the bars scale to
  # the largest total the card has seen.
  max_power: 300
  hours: 3        # the chart's range to start on: 1, 3 or 24
  period: week    # the energy bars: day, week, month or all
