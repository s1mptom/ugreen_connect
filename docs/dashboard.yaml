# The view in docs/dashboard.png: the charger on one screen.
#
# Every card here ships with the integration -- installing it is enough, there
# is nothing to add in HACS and no resource to wire up by hand.
#
# TO USE: paste under `views:` in a dashboard's raw configuration editor, then
#   - replace the device_id with your charger's (Settings -> Devices -> your
#     charger; it is the last part of the URL), and
#   - drop `max_power` or set it to your model's rating; without it the bars
#     scale to the largest total the card has seen.
#
# The Custom mode limits card is conditional: it appears only while the charger
# is in that mode, because the sensors behind it read nothing under a preset.
# Its entity ids are the one part of this that is not device_id-driven, so they
# need the charger's own prefix.

title: Charger
path: charger
icon: mdi:ev-station
type: sections
max_columns: 4
dense_section_placement: true
sections:
- type: grid
  column_span: 4
  cards:
  - type: custom:ugreen-charger-card
    device_id: 0123456789abcdef0123456789abcdef
    max_power: 300
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: custom:ugreen-ports-card
    device_id: 0123456789abcdef0123456789abcdef
    max_power: 300
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: custom:ugreen-power-card
    device_id: 0123456789abcdef0123456789abcdef
    hours: 3
    grid_options:
      columns: full
  - type: custom:ugreen-energy-card
    device_id: 0123456789abcdef0123456789abcdef
    period: week
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: custom:ugreen-wallpaper-card
    device_id: 0123456789abcdef0123456789abcdef
    title: Screensaver
  - type: conditional
    conditions:
    - condition: state
      entity: select.ugreen_nexode_pro_x783_charging_mode
      state: custom
    card:
      type: entities
      title: Custom mode limits
      entities:
      - entity: sensor.ugreen_nexode_pro_x783_c1_custom_mode_limit
        name: C1
      - entity: sensor.ugreen_nexode_pro_x783_c2_custom_mode_limit
        name: C2
      - entity: sensor.ugreen_nexode_pro_x783_c3_custom_mode_limit
        name: C3
      - entity: sensor.ugreen_nexode_pro_x783_c4_custom_mode_limit
        name: C4
      - entity: sensor.ugreen_nexode_pro_x783_c5_custom_mode_limit
        name: C5
      - entity: sensor.ugreen_nexode_pro_x783_c6_a_custom_mode_limit
        name: C6+A
