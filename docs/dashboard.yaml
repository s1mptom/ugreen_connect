# The charger's own cards, laid out in sections -- for a dashboard the charger
# shares with other things. If it has a view to itself, docs/dashboard-panel.yaml
# is the same screen laid out by one card, which fits the pieces more tightly.
#
# Every card here ships with the integration -- installing it is enough, there
# is nothing to add in HACS and no resource to wire up by hand.
#
# TO USE: paste under `views:` in a dashboard's raw configuration editor, then
#   - replace the device_id with your charger's (Settings -> Devices -> your
#     charger; it is the last part of the URL), or drop it with one charger, and
#   - set `max_power` to your model's rating, or drop it; without it the
#     budget bar scales to the largest reading the card has seen.
#
# The custom-mode limits are part of the charger card: they appear beside the
# modes while the charger runs Custom, since the sensors behind them read
# nothing under a preset.

title: Charger
path: charger
icon: mdi:ev-station
type: sections
max_columns: 4
dense_section_placement: true
sections:
- type: grid
  column_span: 4
  cards:
  - type: custom:ugreen-charger-card
    device_id: 0123456789abcdef0123456789abcdef
    max_power: 300
    grid_options:
      columns: full
  - type: custom:ugreen-ports-card
    device_id: 0123456789abcdef0123456789abcdef
    grid_options:
      columns: full
- type: grid
  column_span: 3
  cards:
  - type: custom:ugreen-power-card
    device_id: 0123456789abcdef0123456789abcdef
    hours: 3
    grid_options:
      columns: full
      rows: 7
- type: grid
  column_span: 1
  cards:
  - type: custom:ugreen-sessions-card
    device_id: 0123456789abcdef0123456789abcdef
    grid_options:
      columns: full
  - type: custom:ugreen-energy-card
    device_id: 0123456789abcdef0123456789abcdef
    period: week
    grid_options:
      columns: full
  - type: custom:ugreen-wallpaper-card
    device_id: 0123456789abcdef0123456789abcdef
    grid_options:
      columns: full
