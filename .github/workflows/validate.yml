name: Validate

on:
  push:
  pull_request:
  schedule:
    # Both checks track moving targets, so a green build today can rot quietly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The domain is not in home-assistant/brands, which only matters for
          # the default HACS store; adding the repository by hand works either way.
          ignore: brands
