name: Validate

on:
  push:
  pull_request:
  schedule:
    # Both checks track moving targets, so a green build today can rot quietly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hassfest runs from an image on ghcr.io, and the registry throttles hard
      # enough that the same commit passes or fails depending on the hour. Two
      # things help and both are here: authenticating raises the limit, and
      # pulling with a few attempts leaves the image local, after which
      # `docker run` inside the action skips the registry entirely. Deleting
      # either one puts the flakiness back.
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Fetch the hassfest image, retrying
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull ghcr.io/home-assistant/hassfest:latest; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "attempt $attempt did not get it; waiting $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::ghcr.io would not hand over the hassfest image after five attempts"
          exit 1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: with UP, SIM and RUF selected, an unrelated pull request would
      # otherwise go red the week ruff ships a new rule. The weekly cron is
      # where that belongs -- against nobody's change in particular.
      - run: pip install "ruff==0.16.1"
      # Narrow on purpose: imports left behind by a refactor and names that no
      # longer exist, not style. See ruff.toml.
      - run: ruff check .

  cards:
    name: Cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cards are plain modules with no build step, so nothing catches a
      # typo in them until a browser does -- and a browser only says so to
      # whoever opened the dashboard. `node --check` parses each file the way
      # the browser will.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for file in custom_components/ugreen_connect/www/*.js; do
            node --check "$file"
          done
      # And what the chart does to readings before it draws them, which is the
      # one piece of card code that can be wrong rather than merely ugly.
      - run: node --test tests_js/

  tests:
    name: Session logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # `session.py` carries no Home Assistant imports precisely so its rules can be
      # exercised without installing one; the tests load it straight from its file and
      # fail loudly if that ever stops being true.
      - run: pip install pytest aiohttp cryptography
      - run: pytest tests -q

  integration:
    name: Home Assistant layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run inside the image the integration actually runs in.
      #
      # `pytest-homeassistant-custom-component` pins one exact Home Assistant
      # per release of itself, and which release pip picks depends on the
      # Python it installs under. On a bare runner that lands on a Home
      # Assistant months behind the one anybody deploys, and entities that
      # depend on newer registry calls simply never appear -- a red job about a
      # release nobody targets. Inside the image the Python is Home Assistant's
      # own, so pip picks the plugin that pins the version already installed
      # and nothing moves. It also makes this job and a local run the same
      # command instead of two environments that agree by luck.
      #
      # Pinned on purpose: this says the integration works on one known
      # version, and moving to the next should be a commit somebody made.
      - name: Fetch the Home Assistant image, retrying
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull ghcr.io/home-assistant/home-assistant:2026.9.1; then
              exit 0
            fi
            echo "attempt $attempt did not get it; waiting $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::ghcr.io would not hand over the Home Assistant image after five attempts"
          exit 1
      # No flags: `tests_ha/pytest.ini` says what this directory needs, so the
      # command here is the one to run by hand and the two cannot drift.
      - name: Start the integration under Home Assistant
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             ghcr.io/home-assistant/home-assistant:2026.9.1             sh -c 'pip install --quiet pytest-homeassistant-custom-component && pytest tests_ha -q'

